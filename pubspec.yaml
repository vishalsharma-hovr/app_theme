name: app_theme
description: "A new Flutter package project."
version: 0.0.1
publish_to: none

environment:
  sdk: ">=3.4.3 <4.0.0"
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  lottie: ^3.0.0
  custom_text_view:
    git:
      url: https://github.com/vishalsharma-hovr/custom_text_view.git

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  assets:
    - assets/lottie/pumpkin.json
    - assets/lottie/bat.json
    - assets/lottie/snowflake.json
    - assets/lottie/christmas_tree.json
    - assets/lottie/fireworks.json
    - assets/lottie/party_popper.json
  # To add assets to your package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/assets-and-images/#from-packages
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # To add custom fonts to your package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Inter-ExtraLight
      fonts:
        - asset: fonts/Inter-ExtraLight.ttf
    - family: Inter-Regular
      fonts:
        - asset: fonts/Inter-Regular.ttf
    - family: Inter-Black
      fonts:
        - asset: fonts/Inter-Black.ttf

  # For details regarding fonts in packages, see
  # https://flutter.dev/custom-fonts/#from-packages
